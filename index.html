<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Audio First — What am I holding?</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- Camera feed is read by the model but never shown on screen. -->
  <video id="webcam" autoplay playsinline muted aria-hidden="true" class="hidden-video"></video>

  <main id="app">
    <div id="status-row">
      <span id="dot" aria-hidden="true"></span>
      <span id="status-text">Point your camera at an object</span>
    </div>

    <div id="word-wrap">
      <div id="guess" aria-live="polite">Ready</div>
    </div>

    <p id="start-error" role="alert"></p>

    <button id="main-btn">Start listening</button>
  </main>

  <span id="sr-announce" class="sr-only" aria-live="assertive"></span>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
